<h2>Olympic games app</h2>
<hr />

<div>
  <div class="center">
    <div>{{ titlePage }}</div>
  </div>

  <div class="split">
    <app-stat-card title="Number of countries" [value]="totalCountries" />
    <app-stat-card title="Number of JOs" [value]="totalJOs" />
  </div>

  @if (countries && medals) {
    <app-medal-chart [countries]="countries" [sumOfAllMedalsYears]="medals"/>
  } @else {
    <p>Chargement...</p>
  }


</div>
