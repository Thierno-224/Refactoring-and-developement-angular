<div>
  <div>
    <div class="center">
      <div>{{ titlePage }}</div>
    </div>

    <div class="split">
      <app-stat-card title="Number of entries" [value]="totalEntries" />
      <app-stat-card title="Total Number of medals" [value]="totalMedals" />
      <app-stat-card title="Total Number of athletes" [value]="totalAthletes" />
    </div>
  </div>

  @if (medals && years) {
    <app-country-chart [medals]="medals" [years]="years" />
  }

  <div class="center">
    <a routerLink="">Go back</a>
  </div>
</div>
